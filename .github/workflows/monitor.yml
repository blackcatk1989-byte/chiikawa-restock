name: chiikawa-restock

on:
  schedule:
    # 每 5 分鐘一次，UTC 0:00–10:55 = 台北時間 8:00–18:55
    - cron: "*/5 0-10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chiikawa-restock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add state.json
            git commit -m "update stock state"
            git push
          fi
